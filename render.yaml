# ============================================================
# render.yaml — Despliegue GRATIS del backend de CallAIbrate en Render.
# (El frontend va en Vercel; ver DEPLOY_GRATIS.md.)
#
# Crea, en el plan gratuito y ya conectados:
#   - un servicio web con el backend FastAPI (Docker),
#   - una base de datos PostgreSQL.
#
# NO usa worker Celery ni Redis: las llamadas se procesan dentro de la propia
# API (PROCESS_INLINE=true), porque el plan gratis de Render no ofrece workers.
# ============================================================

databases:
  - name: callaibrate-db
    plan: free
    databaseName: callaibrate
    user: callaibrate

services:
  - type: web
    name: callaibrate-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # El arranque (migraciones + seed + servidor) lo define el CMD del Dockerfile,
    # asi se evita que Render parta mal el comando con comillas.
    envVars:
      - key: PROCESS_INLINE        # procesa sin worker Celery
        value: "true"
      - key: SEED_DEMO             # datos de ejemplo para que la demo publica no salga vacia
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: WHISPER_PROVIDER
        value: groq
      - key: AI_MODEL_GROQ
        value: openai/gpt-oss-120b
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_PATH
        value: /data/audios
      - key: DATABASE_URL          # se conecta automaticamente a la BD de arriba
        fromDatabase:
          name: callaibrate-db
          property: connectionString
      - key: JWT_SECRET            # Render genera uno aleatorio
        generateValue: true
      - key: GROQ_API_KEY          # SECRETO: lo pones tu en el dashboard
        sync: false
      - key: CORS_ORIGINS          # la URL de tu frontend en Vercel (la pones tu)
        sync: false
      - key: SENTRY_DSN            # opcional: monitorizacion de errores (la pones tu)
        sync: false
